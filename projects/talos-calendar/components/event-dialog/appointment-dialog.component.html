<talos-dialog-header [title]="isCreate() ? 'New Event / Appointment' : isEdit() ? 'Edit Event' : 'Event Details'">
  @if (isPreview() && activeEvent()) {
  <div talos-dialog-header-actions class="preview-header-actions">
    @if (canEdit()) {
    <button talosButton variant="ghost" [iconOnly]="true" size="sm" type="button" class="header-action-btn"
      talosTooltip="Edit Event" aria-label="Edit Event" (click)="switchToEdit()">
      <svg lucidePencil [size]="16"></svg>
    </button>
    }
    @if (canDelete()) {
    <button talosButton variant="ghost" [iconOnly]="true" size="sm" type="button" class="header-action-btn delete-btn"
      talosTooltip="Delete Event" aria-label="Delete Event" (click)="triggerDelete()">
      <svg lucideTrash2 [size]="16"></svg>
    </button>
    }
  </div>
  }
</talos-dialog-header>

<talos-dialog-content>
  @if (isPreview() && activeEvent()) {
  <talos-appointment-preview [event]="activeEvent()!" [allowEdit]="canEdit()" [allowDelete]="canDelete()"
    [showActions]="false" (edit)="switchToEdit()" (delete)="onDelete($event)" (close)="onCancel()">
    <ng-content select="[previewExtension], [previewContent], [dialogPreview]"></ng-content>
    <ng-content></ng-content>
  </talos-appointment-preview>
  } @else {
  <talos-appointment-form [event]="activeEvent()" [dateSelection]="data?.dateSelection"
    [mode]="isCreate() ? 'create' : 'edit'" [allowDelete]="canDelete()" [showActions]="false" (save)="onSave($event)"
    (delete)="onDelete($event)" (cancel)="onCancel()" />
  }
</talos-dialog-content>

@if (!isPreview()) {
<talos-dialog-footer>
  <div class="dialog-footer-actions">
    @if (canDelete() && isEdit()) {
    <button talosButton variant="danger" type="button" (click)="triggerDelete()">
      <svg lucideTrash2 [size]="16"></svg>
      <span>Delete</span>
    </button>
    }

    <div class="right-actions">
      <button talosButton variant="outline" type="button" (click)="onCancel()">
        Cancel
      </button>
      <button talosButton variant="primary" type="button" (click)="submitForm()">
        {{ isEdit() ? 'Save Changes' : 'Create Event' }}
      </button>
    </div>
  </div>
</talos-dialog-footer>
}
